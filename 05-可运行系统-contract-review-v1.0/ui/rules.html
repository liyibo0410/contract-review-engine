<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合规规则与模板 · 合同智能审查系统 v1.0</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="page">
  <div class="page-head">
    <div>
      <h1>合规规则与模板</h1>
      <p>按合同类型维护审查规则项、触发条件、风险分级与标准示范条款库</p>
    </div>
    <div class="spacer"></div>
    <span class="faint" id="verInfo" style="font-size:12px"></span>
    <button class="btn" onclick="addRule()">新增规则</button>
    <button class="btn primary" onclick="saveRules()">保存规则库</button>
  </div>

  <div class="wb" style="grid-template-columns:270px minmax(0,1fr)">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="panel">
        <div class="panel-head"><span class="ttl">合同类型</span></div>
        <div class="panel-body" id="typeList"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="ttl">规则统计</span></div>
        <div class="panel-body" id="ruleStats"></div>
      </div>
      <div class="panel">
        <div class="panel-head"><span class="ttl">条款类型词典</span>
          <div class="spacer"></div><span class="faint" id="ctCount" style="font-size:11.5px"></span></div>
        <div class="panel-body" id="ctList" style="max-height:300px;overflow:auto"></div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="panel">
        <div class="panel-head">
          <span class="ttl" id="curTypeLabel">审查规则清单</span>
          <span class="faint" id="curStance" style="font-size:12px"></span>
        </div>
        <div class="panel-body" style="padding:0">
          <table class="grid">
            <thead><tr>
              <th style="width:96px">规则编号</th>
              <th>风险项名称</th>
              <th style="width:74px">等级</th>
              <th style="width:104px">条款类型</th>
              <th style="width:92px">匹配方式</th>
              <th>触发条件</th>
              <th style="width:96px" class="right">操作</th>
            </tr></thead>
            <tbody id="ruleBody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><span class="ttl">标准示范条款库</span>
          <div class="spacer"></div>
          <span class="faint" style="font-size:11.5px">条款推荐引擎的知识底座：命中规则时优先取此处的示范条款</span></div>
        <div class="panel-body" id="libBox"></div>
      </div>
    </div>
  </div>
</div>

<!-- 规则编辑 -->
<div class="mask" id="mRule">
  <div class="modal" style="max-width:760px">
    <div class="mh" id="mRuleTitle">编辑审查规则</div>
    <div class="mb">
      <div class="row wrap">
        <label style="font-size:12.5px">规则编号<input type="text" id="eId" style="width:150px;margin-left:6px"></label>
        <label style="font-size:12.5px">风险等级
          <select id="eRisk" style="margin-left:6px">
            <option value="high">高风险</option><option value="medium">中风险</option><option value="low">低风险</option>
          </select></label>
        <label style="font-size:12.5px">匹配方式
          <select id="eMode" style="margin-left:6px">
            <option value="regex">regex（正则匹配）</option>
            <option value="keyword">keyword（关键词包含）</option>
            <option value="absence">absence（必备条款缺失）</option>
            <option value="pair">pair（权责不对称配对）</option>
            <option value="numeric">numeric（数值阈值）</option>
          </select></label>
      </div>
      <div class="row wrap" style="margin-top:8px">
        <label style="font-size:12.5px;flex:1">风险项名称<input type="text" id="eName" style="width:100%;margin-top:4px"></label>
        <label style="font-size:12.5px;width:150px">条款类型<input type="text" id="eClause" style="width:100%;margin-top:4px"></label>
      </div>
      <div class="field"><div class="lab">触发条件（每行一条；regex 模式写正则，absence 模式写「应当出现的正向表达式」）</div>
        <textarea id="ePatterns" rows="5" style="width:100%;font-family:var(--mono);font-size:12px"></textarea></div>
      <div class="row wrap" id="numRow" style="margin-top:8px;display:none">
        <label style="font-size:12.5px">比较符
          <select id="eOp" style="margin-left:6px">
            <option value="gt">&gt;</option><option value="gte">&ge;</option>
            <option value="lt">&lt;</option><option value="lte">&le;</option>
          </select></label>
        <label style="font-size:12.5px;margin-left:12px">阈值<input type="text" id="eTh" style="width:80px;margin-left:6px"></label>
      </div>
      <div class="field"><div class="lab">权责不对称 · 相对方一侧的触发条件（仅 pair 模式，每行一条）</div>
        <textarea id="eAlt" rows="2" style="width:100%;font-family:var(--mono);font-size:12px"></textarea></div>
      <div class="field"><div class="lab">风险成因</div><textarea id="eReason" rows="3" style="width:100%"></textarea></div>
      <div class="field"><div class="lab">法律 / 合规依据</div><textarea id="eBasis" rows="2" style="width:100%"></textarea></div>
      <div class="field"><div class="lab">默认推荐修改条款</div><textarea id="eSugg" rows="4" style="width:100%"></textarea></div>
    </div>
    <div class="mf">
      <button class="btn danger" onclick="delRule()">删除该规则</button>
      <div class="spacer" style="flex:1"></div>
      <button class="btn" onclick="CR.closeModal('mRule')">取消</button>
      <button class="btn primary" onclick="applyRule()">确定</button>
    </div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
let RULES = null;      // 当前类型的规则库
let CUR = 'purchase';
let EDIT_IDX = -1;
let DIRTY = false;

CR.renderTopbar('/rules', '规则维护 · 修改前自动备份 .bak');

async function loadRules(type) {
  CUR = type || CUR;
  RULES = await CR.api('GET', '/api/rules?type=' + CUR);
  if (DIRTY && !confirm('当前规则库有未保存的修改，切换类型将放弃这些修改，是否继续？')) return;
  DIRTY = false;
  renderAll();
}

function renderAll() {
  const types = RULES.types || [];
  const cur = RULES.current;
  const labels = { purchase: '采购合同', sales: '销售合同', service: '服务合同', labor: '劳动合同' };
  CR.$('#typeList').innerHTML = types.map(t =>
    '<div class="row clickable" style="padding:7px 9px;border-radius:6px;margin-bottom:4px;' +
    (t === cur ? 'background:var(--accent-soft);color:var(--accent);font-weight:600' : '') +
    '" onclick="loadRules(\'' + t + '\')">' +
    '<span>' + CR.esc(labels[t] || t) + '</span><div class="spacer" style="flex:1"></div>' +
    '<span class="mono faint" style="font-size:11px">' + CR.esc(t) + '.json</span></div>').join('');

  const s = RULES.stats || {};
  CR.$('#ruleStats').innerHTML =
    '<div class="kv-list">' +
    '<div class="r"><div class="k">规则总数</div><div class="v num">' + (s.count || 0) + '</div></div>' +
    '<div class="r"><div class="k">高风险规则</div><div class="v num" style="color:var(--high)">' + (s.high || 0) + '</div></div>' +
    '<div class="r"><div class="k">中风险规则</div><div class="v num" style="color:var(--mid)">' + (s.medium || 0) + '</div></div>' +
    '<div class="r"><div class="k">低风险规则</div><div class="v num" style="color:var(--low)">' + (s.low || 0) + '</div></div>' +
    '<div class="r"><div class="k">匹配方式</div><div class="v mono" style="font-size:11.5px">' + CR.esc((s.modes || []).join(' / ')) + '</div></div>' +
    '</div>';

  const ct = RULES.clause_types || { types: [] };
  CR.$('#ctCount').textContent = ct.types.length + ' 类';
  CR.$('#ctList').innerHTML = ct.types.map(t =>
    '<div style="padding:5px 0;border-bottom:1px dashed var(--line-2)">' +
    '<div style="font-size:12.5px;font-weight:560">' + CR.esc(t.label) +
    ' <span class="faint mono" style="font-size:10.5px">' + CR.esc(t.code) + '</span></div>' +
    '<div class="faint" style="font-size:11.5px">' + CR.esc(t.keywords.join('、')) + '</div></div>').join('');

  const rd = RULES.rules || {};
  CR.$('#curTypeLabel').textContent = (rd.type_label || cur) + ' · 审查规则清单';
  CR.$('#curStance').textContent = rd.stance ? ('审查立场：' + rd.stance) : '';
  CR.$('#verInfo').textContent = '规则版本 ' + (rd.version || '-') + ' · 共 ' + ((rd.rules || []).length) + ' 条';

  CR.$('#ruleBody').innerHTML = (rd.rules || []).map((r, i) => {
    const pats = (r.patterns || []).concat(r.patterns_alt || []);
    return '<tr class="rule-row">' +
      '<td class="mono" style="font-size:11.5px">' + CR.esc(r.id) + '</td>' +
      '<td style="font-weight:560">' + CR.esc(r.name) + '</td>' +
      '<td>' + CR.riskTag(r.risk_level, r.risk_level === 'high' ? '高' : r.risk_level === 'medium' ? '中' : '低') + '</td>' +
      '<td style="font-size:12px">' + CR.esc(r.clause_type) + '</td>' +
      '<td><span class="tag t-plain mono" style="font-size:11px">' + CR.esc(r.mode) + '</span></td>' +
      '<td class="cond">' + pats.map(p => CR.esc(p)).join('<br>') +
        (r.mode === 'numeric' ? '<div class="faint">阈值：' + CR.esc(r.numeric_op) + ' ' + CR.esc(r.numeric_threshold) + '</div>' : '') +
        '</td>' +
      '<td class="right"><button class="btn sm" onclick="editRule(' + i + ')">编辑</button></td>' +
      '</tr>';
  }).join('');

  const lib = (RULES.library || {}).library || {};
  const keys = Object.keys(lib);
  CR.$('#libBox').innerHTML = keys.length ? keys.map(k =>
    '<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line-2)">' +
    '<div class="mono" style="font-size:11.5px;color:var(--sub)">' + CR.esc(k) + '</div>' +
    lib[k].map(o => '<div style="margin-top:5px"><b style="font-size:12.5px">' + CR.esc(o.title) + '</b>' +
      '<div class="quote">' + CR.esc(o.text) + '</div>' +
      '<div class="faint" style="font-size:11.5px;margin-top:3px">' + CR.esc(o.note || '') + '</div></div>').join('') +
    '</div>').join('')
    : '<div class="muted" style="font-size:12.5px">该类型暂无专属示范条款，命中规则时将直接采用规则内置的默认建议条款。</div>';
}

/* ------------------------------------------------------------------ 编辑 */
function editRule(i) {
  const r = RULES.rules.rules[i];
  EDIT_IDX = i;
  CR.$('#mRuleTitle').textContent = '编辑规则 ' + r.id;
  CR.$('#eId').value = r.id || '';
  CR.$('#eName').value = r.name || '';
  CR.$('#eRisk').value = r.risk_level || 'medium';
  CR.$('#eMode').value = r.mode || 'regex';
  CR.$('#eClause').value = r.clause_type || '';
  CR.$('#ePatterns').value = (r.patterns || []).join('\n');
  CR.$('#eAlt').value = (r.patterns_alt || []).join('\n');
  CR.$('#eOp').value = r.numeric_op || 'gt';
  CR.$('#eTh').value = (r.numeric_threshold === undefined ? '' : r.numeric_threshold);
  CR.$('#eReason').value = r.reason || '';
  CR.$('#eBasis').value = r.legal_basis || '';
  CR.$('#eSugg').value = r.suggestion_default || '';
  CR.$('#mRule').querySelector('.btn.danger').style.visibility = 'visible';
  onModeChange();
  CR.openModal('mRule');
}
function onModeChange() {
  const m = CR.$('#eMode').value;
  CR.$('#numRow').style.display = (m === 'numeric') ? 'flex' : 'none';
  CR.$('#eAlt').parentElement.style.display = (m === 'pair') ? 'block' : 'none';
}
document.addEventListener('change', function (e) { if (e.target && e.target.id === 'eMode') onModeChange(); });

function addRule() {
  EDIT_IDX = -1;
  CR.$('#mRuleTitle').textContent = '新增审查规则';
  ['eId', 'eName', 'eClause', 'ePatterns', 'eAlt', 'eTh', 'eReason', 'eBasis', 'eSugg'].forEach(id => CR.$('#' + id).value = '');
  CR.$('#eRisk').value = 'medium';
  CR.$('#eMode').value = 'regex';
  CR.$('#mRule').querySelector('.btn.danger').style.visibility = 'hidden';
  onModeChange();
  CR.openModal('mRule');
}

function applyRule() {
  const lines = v => v.split('\n').map(s => s.trim()).filter(Boolean);
  const r = {
    id: CR.$('#eId').value.trim(), name: CR.$('#eName').value.trim(),
    risk_level: CR.$('#eRisk').value, clause_type: CR.$('#eClause').value.trim(),
    mode: CR.$('#eMode').value, patterns: lines(CR.$('#ePatterns').value),
    reason: CR.$('#eReason').value.trim(), legal_basis: CR.$('#eBasis').value.trim(),
    suggestion_default: CR.$('#eSugg').value.trim()
  };
  if (!r.id || !r.name || !r.patterns.length) return CR.toast('规则编号、名称、触发条件均为必填', 'err');
  const alt = lines(CR.$('#eAlt').value);
  if (r.mode === 'pair') { if (!alt.length) return CR.toast('pair 模式必须填写相对方一侧的触发条件', 'err'); r.patterns_alt = alt; }
  if (r.mode === 'numeric') {
    r.numeric_op = CR.$('#eOp').value;
    r.numeric_threshold = Number(CR.$('#eTh').value || 0);
  }
  // 保存前先做一次正则可编译性校验
  if (r.mode !== 'keyword') {
    const bad = (r.patterns || []).concat(r.patterns_alt || [])
      .map(p => checkPattern(p)).filter(Boolean);
    if (bad.length) return CR.toast('正则写法有误：' + CR.esc(bad[0]), 'err');
  }
  if (EDIT_IDX >= 0) RULES.rules.rules[EDIT_IDX] = r; else RULES.rules.rules.push(r);
  DIRTY = true;
  CR.closeModal('mRule');
  renderAll();
  CR.toast('已修改（尚未落盘），点右上角「保存规则库」写入配置文件', 'ok');
}

function delRule() {
  if (EDIT_IDX < 0) return;
  const r = RULES.rules.rules[EDIT_IDX];
  if (!confirm('确认删除规则 ' + r.id + ' ？')) return;
  RULES.rules.rules.splice(EDIT_IDX, 1);
  DIRTY = true;
  CR.closeModal('mRule');
  renderAll();
}

/* 正则可编译性校验：写坏的正则在后端会被跳过并记入诊断，
   这里在保存前就拦下来，避免"改了规则却静默失效"。 */
function checkPattern(pat) {
  try { new RegExp(pat); return ''; }
  catch (e) { return e.message; }
}

function validateRules(rules) {
  const bad = [];
  rules.forEach(r => {
    const pats = (r.patterns || []).concat(r.patterns_alt || []);
    pats.forEach(p => {
      // keyword 模式会把关键词转义处理，不需要按正则校验
      if (r.mode === 'keyword') return;
      const err = checkPattern(p);
      if (err) bad.push({ id: r.id, pattern: p, error: err });
    });
  });
  return bad;
}

async function saveRules() {
  const bad = validateRules(RULES.rules.rules);
  if (bad.length) {
    const msg = bad.slice(0, 3).map(b => b.id + ' → ' + b.error).join('；');
    if (!confirm('检测到 ' + bad.length + ' 处正则写法有问题，这些规则在审查时会被跳过：\n\n' +
                 msg + '\n\n仍要保存吗？（建议先修正）')) return;
  }
  try {
    const d = await CR.api('POST', '/api/rules/' + CUR, {
      rules: RULES.rules.rules, version: RULES.rules.version
    });
    DIRTY = false;
    CR.toast('规则库已保存（写入 config/rules/' + CUR + '.json，原文件备份为 .bak），共 ' +
      d.count + ' 条规则', 'ok');
    await loadRules(CUR);
  } catch (e) { CR.toast('保存失败：' + CR.esc(e.message), 'err'); }
}

window.addEventListener('beforeunload', function (e) {
  if (DIRTY) { e.preventDefault(); e.returnValue = ''; }
});

loadRules('purchase');
</script>
</body>
</html>
