# ============================================================================
# 衡鉴 · 标准示范条款库
# ----------------------------------------------------------------------------
# 用途：规则命中后，为每条风险配一段"可直接落地"的替代表述。
# 为什么不用 LLM 直接生成？—— 示范条款是要写进合同、要承担法律后果的文本。
# 以标准库为底稿、LLM 只做措辞调整，是"可用且可控"的正确姿势。
# 每条模板都标注了拟替换比例与谈判要点，法务可在工作台直接编辑后采纳。
# ============================================================================
version: "1.0.0"
updated_at: "2026-09-19"

templates:
  - id: T-IP-001
    title: 知识产权归属与许可（保留我方权利）
    clause_type: ip
    text: >-
      一方在履行本合同前已拥有的知识产权仍归该方所有。乙方为履行本合同专门开发、定制形成的
      交付物（含源代码、设计文档、接口说明），其著作权归甲方所有，乙方保留在其通用产品中的
      复用权利，但不得向第三方披露甲方的业务数据与定制逻辑。乙方保证其交付物不侵犯任何
      第三方知识产权，如因此引发第三方主张，由乙方负责处理并承担全部责任及甲方因此产生的
      合理费用。
    note: 谈判要点：① 区分"既有 IP"与"定制成果"；② 定制成果归我方；③ 必设侵权兜底与赔偿条款
    adopted_ratio: 0.85

  - id: T-PAY-001
    title: 里程碑付款＋验收前置
    clause_type: payment
    text: >-
      合同价款按里程碑分四期支付：① 合同生效且乙方提交实施计划后 5 个工作日内支付 30%；
      ② 系统上线并经甲方书面确认初步验收合格后支付 40%；③ 全部交付物移交完成、甲方出具
      终验合格报告后支付 20%；④ 质保期满且无未决质量问题后支付剩余 10%。各期付款均以甲方
      出具的验收合格证明为前置条件。乙方应于每期付款前开具等额增值税专用发票，甲方收到
      合规发票后 15 个工作日内付款。
    note: 谈判要点：首付款不超过 30%、尾款留质保金、发票与验收同为付款前置
    adopted_ratio: 0.9

  - id: T-PAY-002
    title: 预付款与担保对等安排
    clause_type: payment
    text: >-
      甲方可向乙方支付不超过合同总价 20% 的预付款，乙方应在收款前向甲方提供同等金额的
      银行履约保函或由甲方认可的第三方担保；未提供担保的，预付款比例不超过 10%。预付款
      在后续进度款中按比例抵扣。乙方未按约定进度履行的，甲方有权要求乙方在 10 个工作日内
      退还全部未抵扣预付款并支付同期银行贷款利息。
    note: 谈判要点：把"给钱"与"拿担保"绑定，是控制资金风险最直接的一招
    adopted_ratio: 0.8

  - id: T-LIA-001
    title: 对等违约责任（含赔偿上限）
    clause_type: liability
    text: >-
      任何一方未按本合同约定履行义务的，应向守约方支付违约金，违约金标准为每日按未履行
      部分金额的万分之五计算，累计不超过合同总价的 20%。因一方违约给对方造成损失超过
      违约金的，违约方应就超出部分承担赔偿责任，但双方在本合同项下的累计赔偿总额均不超过
      合同总价；因故意或重大过失、侵犯知识产权、违反保密义务所造成的损失不受前述上限限制。
    note: 谈判要点：① 双方同一标准；② 设 20% 上限；③ 把侵权/泄密排除在限额外（对我方更有利）
    adopted_ratio: 0.9

  - id: T-LIA-002
    title: 违约金比例合理区间
    clause_type: liability
    text: >-
      违约金以守约方的实际损失为基础，约定比例不超过合同总价的 20%。约定的违约金过分高于
      实际损失时，守约方有权请求人民法院或仲裁机构予以适当减少；低于实际损失时，可请求
      增加至实际损失额。
    note: 谈判要点：20% 是司法实务中较稳妥的上限，超过 30% 存在被调减的风险
    adopted_ratio: 0.85

  - id: T-LIA-003
    title: 赔偿责任上限与除外情形
    clause_type: liability
    text: >-
      除因故意或重大过失、侵犯第三方知识产权、违反保密义务而产生的责任外，任何一方在本合同
      项下承担的赔偿责任（含违约金）累计以合同总价为上限。任何一方均不对对方的间接损失、
      可得利益损失、数据丢失损失承担赔偿责任。
    note: 谈判要点：把"间接损失/可得利益"排除掉，是控制赔偿敞口的关键一句话
    adopted_ratio: 0.85

  - id: T-DIS-001
    title: 争议解决与管辖（我方所在地优先）
    clause_type: dispute
    text: >-
      因本合同的解释或履行发生争议，双方应首先友好协商解决；协商不成的，任何一方均有权向
      甲方所在地有管辖权的人民法院提起诉讼。本合同的订立、效力、解释、履行及争议解决均
      适用中华人民共和国法律（不含港澳台地区法律）。
    note: 谈判要点：管辖地是对等博弈的筹码，底线是"合同签订地"或"被告所在地"，避免约定在对方所在地
    adopted_ratio: 0.9

  - id: T-SUB-001
    title: 主体资质与签署权限
    clause_type: subject
    text: >-
      乙方保证其为依法设立并有效存续的企业法人，具备履行本合同所需的全部资质与许可，
      并应在本合同签署时向甲方提供加盖公章的营业执照副本复印件、相关资质证明文件及
      法定代表人身份证明；由授权代表签署的，还应提供法定代表人签署的授权委托书。
      乙方主体信息发生变更的，应在 5 个工作日内书面通知甲方。
    note: 谈判要点：把"提供资质证明"写成对方的先合同义务，并挂钩付款条件
    adopted_ratio: 0.9

  - id: T-CON-001
    title: 双向保密义务（含期限）
    clause_type: confidentiality
    text: >-
      甲乙双方对因履行本合同而获知的对方商业秘密、技术资料、客户信息及其他非公开信息
      均负有保密义务，未经披露方书面同意不得向任何第三方披露或用于本合同以外的目的。
      保密期限自本合同签署之日起至本合同终止后 3 年止；涉及个人信息与业务数据的，
      保密义务不受期限限制。违反保密义务的，应赔偿守约方因此遭受的全部损失。
    note: 谈判要点：① 双向；② 明确期限（3 年为常见约定）；③ 数据类义务设为永久
    adopted_ratio: 0.9

  - id: T-FOR-001
    title: 不可抗力（含通知时效与证明）
    clause_type: force_majeure
    text: >-
      因地震、台风、洪水、火灾、战争、疫情及政府行为等不可抗力致使一方不能履行本合同的，
      遭遇方应在不可抗力事件发生后 5 个工作日内书面通知对方，并在 15 日内提供有权机构出具
      的证明文件。不可抗力影响期间，双方履行期限相应顺延；持续超过 30 日致使合同目的无法
      实现的，任何一方均有权解除本合同且互不承担违约责任。
    note: 谈判要点：通知时效 + 证明文件 + 超期解除权，三件套缺一不可
    adopted_ratio: 0.9

  - id: T-DAT-001
    title: 数据安全与个人信息保护
    clause_type: data_security
    text: >-
      乙方在提供服务过程中接触、处理甲方业务数据与个人信息的，应严格遵守《数据安全法》
      《个人信息保护法》及相关标准，仅在履行本合同必需的最小范围内处理，不得留存、复制、
      向第三方提供或用于其他目的。乙方应采取加密、访问控制、审计留痕等安全措施，发生数据
      泄露等安全事件的，应在 24 小时内书面通知甲方并配合处置；因乙方原因导致数据安全事件的，
      乙方承担全部责任并赔偿甲方因此产生的损失（不受赔偿上限限制）。
    note: 谈判要点：数据合规责任建议明确排除在赔偿限额外，并与《个保法》第 21 条对齐
    adopted_ratio: 0.85

  - id: T-DLV-001
    title: 交付与验收标准
    clause_type: delivery
    text: >-
      乙方应于合同生效之日起 60 个自然日内完成全部交付物的交付，交付地点为甲方指定场所，
      交付内容包括可运行系统、部署文档、操作手册与培训。甲方应在收到交付物之日起 15 个
      工作日内组织验收，验收标准以本合同附件《技术规格说明》约定的功能清单、性能指标与
      测试用例全部通过为准。验收不合格的，乙方应在 10 个工作日内无偿整改并重新提交验收；
      两次验收仍不合格的，甲方有权解除合同并要求乙方退还已付款项。
    note: 谈判要点：把"验收标准"指向可测量的附件（功能清单/性能指标），避免主观判断
    adopted_ratio: 0.9

  - id: T-CON-002
    title: 竞业限制条款（含经济补偿）
    clause_type: confidentiality
    text: >-
      乙方在职期间及离职后 2 年内，不得在与甲方有竞争关系的单位任职或自行从事同类业务。
      甲方应在乙方离职后按月向乙方支付竞业限制经济补偿，标准为乙方离职前十二个月平均工资的
      30%，且不低于劳动合同履行地最低工资标准。甲方未按月支付经济补偿超过三个月的，乙方
      有权请求解除竞业限制约定。
    note: 谈判要点：竞业限制必须"有期限 + 有补偿"成对出现，缺一即条款效力存疑
    adopted_ratio: 0.9

  - id: T-VAL-001
    title: 生效条件、期限、变更与通知送达
    clause_type: validity
    text: >-
      本合同自双方法定代表人或授权代表签字并加盖公章之日起生效，有效期为 24 个月。
      本合同一式肆份，甲乙双方各持贰份，具有同等法律效力；附件为本合同不可分割的组成部分，
      与正文具有同等效力。本合同的任何变更、补充均须经双方协商一致并采用书面形式。
      双方确认以下地址与邮箱为有效通知送达地址，一方变更的应提前 5 个工作日书面告知，
      否则按原地址送达即视为已送达。
    note: 谈判要点：四条一次补齐（生效、份数、书面变更、送达地址），是低风险项但极易漏
    adopted_ratio: 0.9
