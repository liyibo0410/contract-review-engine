<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>衡鉴 · 智能审查工作台</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <div class="wb">

    <!-- ============ 左：合同正文视窗 ============ -->
    <section class="pane">
      <div class="pane-head">
        <select id="taskSel" style="min-width:260px;max-width:340px"></select>
        <span id="taskTags" class="row" style="gap:6px"></span>
        <span class="spacer" style="flex:1"></span>
        <input id="nlq" placeholder="自然语言检索：如「帮我看下付款条件」" style="width:260px">
        <button class="btn sm" id="btnNlq">检索</button>
        <button class="btn sm" id="btnReport">导出报告</button>
      </div>

      <div id="blockedBox" style="display:none;padding:12px 16px"></div>
      <div id="nlqBox" style="display:none;padding:12px 16px"></div>

      <div class="pane-body" id="docBody">
        <div class="empty">选择一份合同开始审查</div>
      </div>
    </section>

    <!-- ============ 右：审查结果与协同 ============ -->
    <section class="pane">
      <div class="pane-head">
        <div class="tabs" style="border:none;margin:0" id="rightTabs">
          <span class="t on" data-tab="findings">风险项 <b id="fCnt">0</b></span>
          <span class="t" data-tab="summary">结论与回写</span>
          <span class="t" data-tab="meta">元数据与画像</span>
        </div>
      </div>
      <div class="pane-body right" id="rightBody">
        <div class="empty">—</div>
      </div>
    </section>
  </div>
</div>
<script src="/assets/js/common.js"></script>
<script src="/assets/js/workbench.js"></script>
</body>
</html>
