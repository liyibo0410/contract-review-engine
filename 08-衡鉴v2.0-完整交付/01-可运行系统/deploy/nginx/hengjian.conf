# 衡鉴 · Nginx 反向代理
# 关键点：SSE（实时进度流）必须关闭缓冲，否则事件会被积压到连接结束才吐出，
# 前端看起来就是"进度条一直不动"。proxy_buffering off 是这块的唯一正确解。

upstream hengjian_backend {
    server hengjian:8130;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;
    charset utf-8;

    access_log /var/log/nginx/hengjian.access.log;
    error_log  /var/log/nginx/hengjian.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    # 实时进度事件流
    location /api/contracts/ {
        proxy_pass http://hengjian_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # SSE 必需
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://hengjian_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
