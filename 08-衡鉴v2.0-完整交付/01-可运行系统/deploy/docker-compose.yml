# ============================================================
#  衡鉴 · 容器编排
#  启动顺序：hengjian（应用，含内置前端）→ 可选 nginx（反向代理 + SSE 不缓冲）
#  零外部服务依赖：数据库是容器内的 SQLite 文件，不需要 MySQL/Redis
# ============================================================
services:

  hengjian:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hengjian:2.0.0
    container_name: hengjian-app
    restart: unless-stopped
    ports:
      - "8130:8130"
    environment:
      HJ_HOST: 0.0.0.0
      HJ_PORT: 8130
      HJ_ROLE: full
      HJ_DB: /data/hengjian.db
      # 大模型：不配置则自动降级为规则模板生成器（演示零事故）
      HJ_LLM_ENABLED: "${HJ_LLM_ENABLED:-1}"
      HJ_LLM_BASE_URL: "${HJ_LLM_BASE_URL:-https://api.deepseek.com/v1}"
      HJ_LLM_API_KEY: "${HJ_LLM_API_KEY:-}"
      HJ_LLM_MODEL: "${HJ_LLM_MODEL:-deepseek-chat}"
      HJ_LLM_TIMEOUT: "${HJ_LLM_TIMEOUT:-8}"
      # 彩排/评审建议设为 1：只生成意见，不写入审批系统
      HJ_WRITEBACK_DRY_RUN: "${HJ_WRITEBACK_DRY_RUN:-0}"
    volumes:
      - hengjian-data:/data
      - ../backend/samples:/app/backend/samples:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8130/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - hengjian-net

  # 可选：需要独立反向代理 / 接入 BossPortal 跨端口 SSO 时启用
  nginx:
    image: nginx:1.27-alpine
    container_name: hengjian-nginx
    restart: unless-stopped
    depends_on:
      hengjian:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/hengjian.conf:/etc/nginx/conf.d/default.conf:ro
    profiles: ["proxy"]
    networks:
      - hengjian-net

volumes:
  hengjian-data:
    driver: local

networks:
  hengjian-net:
    driver: bridge
